# nginx config for alinategh.com (static files, no backend)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # repo-only files never leave the server
    location ~ ^/(\.git|deploy|tools|docs)(/|$)      { return 404; }
    location ~ ^/(README\.md|LICENSE|docker-compose\.yml)$ { return 404; }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # the page and its content always revalidate, so a new content.json shows up straight away
    location = /index.html   { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; }
    location = /content.json { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; }

    # css / js / images: cache for a week, revalidate after
    location ~* \.(css|js)$                   { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=604800, must-revalidate"; }
    location ~* \.(png|jpg|jpeg|ico|svg|webp)$ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=2592000"; }

    # "/" serves index.html; anything unknown is a 404 rather than a copy of the page
    location / { try_files $uri $uri/ =404; }
}
