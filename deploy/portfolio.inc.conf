# Site behaviour for the live alinategh.com server.
#
# portfolio.conf keeps everything about security: the certificates, HSTS,
# X-Frame-Options DENY, the other security headers and the rate limit. This
# file is everything about the site: compression, caching, the lost page and
# which repo files stay private. Inside the listen 443 server, put this one
# line where the site's gzip and location lines used to be:
#
#     include /usr/share/nginx/portfolio/deploy/portfolio.inc.conf;
#
# Do not include deploy/nginx.conf. That file is a whole server for the
# Docker setup, with a different root and a weaker framing header.
#
# Caching uses `expires`, never `add_header`. A location that sets its own
# add_header makes nginx drop the server-level HSTS, nosniff, DENY and
# Referrer-Policy headers for that response; `expires` leaves them alone.

gzip on;
gzip_comp_level 6;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# unknown addresses get the playable lost page, with a real 404 status
error_page 404 /404.html;

# dotfiles (.git, .gitignore …) and repo tooling are not part of the site
location ~ /\.                                            { return 404; }
location ~ ^/(deploy|tools|docs|src)(/|$)                 { return 404; }
location ~ ^/(README\.md|LICENSE|docker-compose\.yml)$    { return 404; }

# fonts and images rarely change: cache them for a month
location ~* \.(woff2|png|jpg|jpeg|ico|svg|webp)$ {
    expires 30d;
    try_files $uri =404;
}

# the page, content.json, css and js keep their names between deploys, so
# browsers check for a new copy on every visit (a quick 304 when nothing changed)
location / {
    expires -1;
    try_files $uri $uri/ =404;
}
