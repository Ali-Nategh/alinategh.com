# Site behaviour for the live alinategh.com server.
#
# portfolio.conf (SSL, HSTS, the rate limit, the port-80 redirect, and the
# handshake-reject default server) stays in charge of security. This file is
# only the parts that belong to the site. Include it from inside the
# listen 443 server, in place of that server's `location /` block:
#
#     include /usr/share/nginx/portfolio/deploy/portfolio.inc.conf;
#
# Do not include deploy/nginx.conf here. That file is a whole server for the
# Docker container, with a different root and weaker framing header.
#
# None of the locations below set add_header, on purpose. The moment a
# location sets one, nginx drops the server-level HSTS, nosniff, DENY, and
# Referrer-Policy lines for that response. Leaving them off lets those
# headers inherit.

error_page 404 /404.html;

# tooling that ships in the repo is not part of the site
location ~ ^/(deploy|tools|docs)(/|$)                    { deny all; }
location ~ ^/(README\.md|LICENSE|docker-compose\.yml)$   { deny all; }

location / {
    try_files $uri $uri/ =404;
}
