# Serve the site with nginx:  docker compose up -d   →  http://localhost:8080
services:
  web:
    image: nginx:1.27-alpine
    container_name: alinategh-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
